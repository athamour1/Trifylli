# Κοινές κεφαλίδες ασφάλειας — γίνονται include σε κάθε location (βλ. template).
# Το `always` τις βάζει και σε 4xx/5xx απαντήσεις.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Η εφαρμογή δεν χρησιμοποιεί κάμερα/μικρόφωνο/θέση· τα κλείνουμε ρητά ώστε
# ούτε ένα τρίτο script (αν ποτέ περνούσε) να μην τα ζητήσει.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS: αγνοείται πάνω από http (development)· πίσω από τον TLS proxy ισχύει.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
