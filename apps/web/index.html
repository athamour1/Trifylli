<!DOCTYPE html>
<html lang="el">
  <head>
    <title><%= productName %></title>
    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <!-- Inter: μία οικογένεια με πλήρη ελληνική υποστήριξη, σε όλη την εφαρμογή.
         `display=swap` + fallback στη Roboto ώστε offline να μη μένει κενό. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <!-- Ρυθμίσεις χρόνου εκτέλεσης — πριν φορτώσει η εφαρμογή. -->
    <script src="/config.js"></script>
    <!--
      Front-channel Single Logout — τρέχει ΑΜΕΣΩΣ, πριν φορτώσει η εφαρμογή.

      Το Authentik φορτώνει το /auth/frontchannel-logout σε κρυφό iframe με πολύ
      σύντομη ζωή· το βαρύ boot της PWA (lazy route chunk, mount) δεν προλαβαίνει.
      Γι' αυτό σηκώνουμε εδώ, inline, το σήμα στο localStorage (κοινό σε όλες τις
      καρτέλες): η κύρια καρτέλα το ακούει (storage event) κι αποσυνδέεται.
    -->
    <script>
      (function () {
        try {
          if (location.pathname === '/auth/frontchannel-logout') {
            localStorage.setItem('trifylli:slo', String(Date.now()));
          }
        } catch (e) {
          /* ιδιωτική περιήγηση — η κύρια καρτέλα αποσυνδέεται στην επόμενη ανανέωση */
        }
      })();
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
