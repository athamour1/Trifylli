server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Τα hashed assets είναι αμετάβλητα· το bundle αλλάζει όνομα σε κάθε build.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Ο service worker και το manifest ΔΕΝ μπαίνουν σε cache: αλλιώς ο browser
  # κρατά για πάντα την παλιά έκδοση και οι ενημερώσεις δεν φτάνουν ποτέ.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  # Runtime config — ποτέ cache· ο entrypoint το γράφει σε κάθε εκκίνηση.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    default_type application/javascript;
  }

  # SPA fallback για vueRouterMode: 'history'.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
