# Παραγωγική στοίβα Trifylli.
#
# ΔΕΝ περιλαμβάνει TLS/reverse proxy — αυτά τα βάζει ο διαχειριστής ΜΠΡΟΣΤΑ από
# τη στοίβα. Proxy στον host (nginx/Caddy): οι υπηρεσίες δένονται στο `BIND_ADDR`
# (default 127.0.0.1). Proxy σε Docker (Zoraxy, NPM, Traefik): σύνδεσέ τον στο
# δίκτυο `trifylli-public` (βλ. `networks:` στο τέλος) — όχι `BIND_ADDR` στην IP
# του LAN. Postgres/Redis/Garage δεν εκτίθενται καθόλου.
#
# Χρήση — χρειάζεται ΜΟΝΟ αυτό το αρχείο, κανένα clone του repo:
#   # 1. .env.prod: ερωτήσεις για domains, SMTP, Τοπικό· τα μυστικά βγαίνουν μόνα τους.
#   docker run --rm -it -v "$PWD:/out" ghcr.io/athamour1/trifylli/config:<TAG> setup-env
#   # 2. Σήκωμα.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Αναβάθμιση: άλλαξε το TAG στο .env.prod (π.χ. v1.1.0) και ξανά `pull` + `up -d`.
# Πριν από τα migrations ο `predeploy-backup` κρατά dump όλων των βάσεων.
# Rollback: το προηγούμενο TAG + επαναφορά από εκείνο το dump.
#
# Τα αρχεία ρυθμίσεων (blueprints/πρότυπα Authentik, init της Postgres, garage.toml)
# ζουν μέσα στο image `config`: σε κάθε `up` ο one-shot `config` τα ξαναγράφει
# σε named volumes πριν ξεκινήσει οτιδήποτε τα διαβάζει. Στο πρώτο `up` το
# `migrate` φτιάχνει και το Τοπικό με τους κλάδους του (TOPIKO_* στο .env.prod).
#
# Τα images έρχονται ΕΤΟΙΜΑ από το GHCR (κανένα τοπικό build):
#   trifylli:  ./release.sh  →  ghcr.io/athamour1/trifylli/{api,web,config}
#   ouchtracker: (στο repo του) ./release.sh  →  ghcr.io/athamour1/ouchtracker/{backend,frontend}
#
# Όλα τα μυστικά είναι ΥΠΟΧΡΕΩΤΙΚΑ (`${VAR:?...}`): αν λείπουν, το compose
# σταματά αντί να σηκώσει στοίβα με αδύναμα defaults.

name: trifylli-prod

# Περιστροφή logs. `local`: συμπιεσμένα αρχεία, ~10× περισσότερο ιστορικό στον
# ίδιο χώρο από το json-file (`docker logs` και το Portainer δουλεύουν ίδια).
# Έως 10 × 20 MB ανά container: εβδομάδες, όχι ώρες — αρκετό για να βρεις ένα
# περιστατικό μέρες μετά, χωρίς να κρατάμε για πάντα ids λογαριασμών.
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: '20m'
      max-file: '10'

# Σκλήρυνση για τα δικά μας containers (Node): καμία ικανότητα kernel, καμία
# απόκτηση προνομίων από setuid binaries. Αν ποτέ εκτελεστεί κώδικας μέσα στο
# container, μένει μέσα στο container.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# ─────────────────── OpenReplay (session replay) — profile `replay` ───────────────────
# Οι μεταβλητές που μοιράζονται όλα τα services του OpenReplay (βάσεις, S3,
# μυστικά — όλα από το .env.prod, `REPLAY_*`). Ό,τι αφορά ένα μόνο service μένει
# σε εκείνο. `:-` και όχι `:?`: το compose αξιολογεί όλο το αρχείο, και χωρίς το
# profile `replay` δεν πρέπει να ζητά τιμές. Πρότυπο: infra/openreplay/README.md.
x-replay-env: &replay-env
  version_number: v1.28.0
  LICENSE_KEY: ''
  LOGLEVEL: INFO
  PYTHONUNBUFFERED: '0'
  SITE_URL: ${REPLAY_URL:-}
  pg_host: postgresql.db.svc.cluster.local
  pg_port: '5432'
  pg_dbname: postgres
  pg_user: postgres
  pg_password: ${REPLAY_PG_PASSWORD:-}
  POSTGRES_STRING: postgres://postgres:${REPLAY_PG_PASSWORD:-}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
  REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379
  ch_host: clickhouse-openreplay-clickhouse.db.svc.cluster.local
  ch_port: '9000'
  ch_port_http: '8123'
  ch_username: default
  ch_user: default
  ch_password: ''
  ch_db: default
  CH_USERNAME: default
  CH_PASSWORD: ''
  CLICKHOUSE_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:9000/default
  CLICKHOUSE_HTTP_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:8123/default
  KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
  KAFKA_USE_SSL: 'false'
  # Οι υπηρεσίες μιλούν με το S3 μέσω του ΔΗΜΟΣΙΟΥ URL (proxy → replay-nginx →
  # RustFS): ο server πρέπει να φτάνει το δικό του δημόσιο όνομα.
  AWS_ENDPOINT: ${REPLAY_URL:-}
  S3_HOST: ${REPLAY_URL:-}
  AWS_ACCESS_KEY_ID: ${REPLAY_S3_KEY:-}
  AWS_SECRET_ACCESS_KEY: ${REPLAY_S3_SECRET:-}
  S3_KEY: ${REPLAY_S3_KEY:-}
  S3_SECRET: ${REPLAY_S3_SECRET:-}
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  JWT_SECRET: ${REPLAY_JWT_SECRET:-}
  JWT_REFRESH_SECRET: ${REPLAY_JWT_REFRESH_SECRET:-}
  JWT_SPOT_SECRET: ${REPLAY_JWT_SPOT_SECRET:-}
  JWT_SPOT_REFRESH_SECRET: ${REPLAY_JWT_SPOT_REFRESH_SECRET:-}
  ASSIST_JWT_SECRET: ${REPLAY_ASSIST_JWT_SECRET:-}
  ASSIST_KEY: ${REPLAY_ASSIST_KEY:-}
  ASSIST_URL: http://assist-openreplay.app.svc.cluster.local:9001/assist/%s
  ASSETS_ORIGIN: ${REPLAY_URL:-}/sessions-assets

x-replay-app: &replay-app
  profiles: [replay]
  restart: always
  <<: *logging
  volumes:
    - replay-shared:/mnt/efs
  depends_on:
    replay-postgres:
      condition: service_healthy
    replay-redis:
      condition: service_healthy
    replay-clickhouse:
      condition: service_healthy
    replay-minio:
      condition: service_healthy
    replay-db-init:
      condition: service_completed_successfully
    replay-ch-init:
      condition: service_completed_successfully

services:
  # ─────────────────── Ρυθμίσεις (one-shot) ───────────────────
  # Σβήνει και ξαναγράφει τα config volumes από το image — ό,τι αφαιρέθηκε από
  # το image φεύγει και από τη στοίβα. Όλοι όσοι τα διαβάζουν περιμένουν αυτόν.
  config:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: 'no'
    <<: *logging
    volumes:
      - authentik-blueprints:/sync/authentik-blueprints
      - authentik-branding:/sync/authentik-branding
      - authentik-templates:/sync/authentik-templates
      - postgres-init:/sync/postgres-init
      - garage-config:/sync/garage
      - backup-hooks:/sync/backup-hooks
      - openreplay-config:/sync/openreplay
      - glitchtip-config:/sync/glitchtip

  postgres:
    image: postgres:16-alpine
    restart: always
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trifylli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-trifylli}
      AUTHENTIK_DB: ${AUTHENTIK_DB:-authentik}
      OUCHTRACKER_DB: ${OUCHTRACKER_DB:-ouchtracker}
    # Καμία θύρα προς τον host — η βάση μένει στο εσωτερικό δίκτυο.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      config:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trifylli} -d ${POSTGRES_DB:-trifylli}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Μόνο για το GlitchTip (profile `errors`, cache και ουρά εργασιών): το
  # Authentik δεν χρησιμοποιεί Redis από το 2025.10 — όλα στο Postgres.
  redis:
    image: redis:7-alpine
    restart: always
    <<: *logging
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  # ─────────────────────── Authentik (SSO) ───────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: always
    <<: *logging
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required (openssl rand -base64 48)}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-trifylli}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB:-authentik}
      # Μόνο για το πρώτο boot (δημιουργία αρχικού διαχειριστή Authentik).
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      # Δημόσια URLs των εφαρμογών (με τελικό «/»). Τα διαβάζουν τα blueprints
      # (`!Env`) για redirect URIs, launch URL και **front-channel logout URI
      # (Single Logout)**. ΠΡΕΠΕΙ να είναι υποτομείς του ΙΔΙΟΥ registrable domain
      # με το Authentik (π.χ. app./ouch./id.trifylli.gr) — αλλιώς ο browser
      # διαχωρίζει (partitions) το storage του κρυφού iframe και το SLO σπάει.
      TRIFYLLI_APP_URL: ${TRIFYLLI_APP_URL:?TRIFYLLI_APP_URL is required (π.χ. https://app.trifylli.gr/)}
      OUCHTRACKER_APP_URL: ${OUCHTRACKER_APP_URL:?OUCHTRACKER_APP_URL is required (π.χ. https://ouch.trifylli.gr/)}
      # «Log in with Authentik» στο GlitchTip (glitchtip-oidc.yaml): redirect URI
      # και το secret του client — ίδιο με του glitchtip-sso.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-}
      GLITCHTIP_OIDC_CLIENT_SECRET: ${GLITCHTIP_OIDC_CLIENT_SECRET:-}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      # ── Blueprint ασφάλειας (trifylli-security.yaml) ──
      # Το κλειδί του token του service account `trifylli-api` (ίδια τιμή με το
      # AUTHENTIK_API_TOKEN του API). Υποχρεωτικό: χωρίς αυτό δεν φεύγουν προσκλήσεις.
      TRIFYLLI_API_TOKEN: ${AUTHENTIK_API_TOKEN:?AUTHENTIK_API_TOKEN is required (openssl rand -hex 32)}
      # MFA: `skip` = προαιρετικό — ζητείται μόνο από όποιον έχει στήσει
      # authenticator (επιλογή του Τοπικού). `configure` = υποχρεωτικό στήσιμο
      # TOTP στην πρώτη σύνδεση.
      TRIFYLLI_MFA_NOT_CONFIGURED: ${AUTHENTIK_MFA_MODE:-skip}
      # Ποιοι επιτρέπεται να δηλώνουν την IP του πελάτη (X-Forwarded-For): ΜΟΝΟ
      # τα δίκτυα της στοίβας — εκεί έρχεται ο proxy, είτε από το `trifylli-public`
      # είτε από τις θύρες του 127.0.0.1. Όχι ολόκληρο το LAN: μια συσκευή του
      # δικτύου θα πλαστογραφούσε IP και θα παρέκαμπτε το φρένο brute force.
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: ${AUTHENTIK_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,${STACK_SUBNET:-10.97.50.0/24},${PUBLIC_SUBNET:-10.97.51.0/24}}
      # ── Email (ανάκτηση κωδικού, ειδοποιήσεις) ──
      # Πραγματικός πάροχος SMTP. Υποχρεωτικός: χωρίς αυτόν η «ανάκτηση κωδικού»
      # αποτυγχάνει τη στιγμή που κάποιος τη χρειάζεται, και κανείς δεν το
      # μαθαίνει νωρίτερα — προτιμάμε να μη σηκωθεί η στοίβα.
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:?SMTP_HOST is required (π.χ. smtp.eu.mailgun.org)}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
      # 587 → STARTTLS (USE_TLS=true). 465 → implicit TLS (USE_SSL=true, USE_TLS=false).
      # Ποτέ και τα δύο true: το Authentik αποτυγχάνει στη σύνδεση.
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: ${SMTP_TIMEOUT:-30}
      # Ο αποστολέας πρέπει να είναι σε domain που ο πάροχος επιτρέπει (SPF/DKIM),
      # αλλιώς τα μηνύματα καταλήγουν σε spam ή απορρίπτονται.
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:?SMTP_FROM is required (π.χ. Trifylli <noreply@trifylli.gr>)}
    volumes:
      - authentik-media:/media
      # Τα blueprints (OIDC providers + SLO) εφαρμόζονται αυτόματα. Τα δημόσια
      # URLs έρχονται από το περιβάλλον (TRIFYLLI_APP_URL / OUCHTRACKER_APP_URL)
      # — ΔΕΝ χρειάζεται πλέον χειροκίνητη αλλαγή στα .yaml.
      - authentik-blueprints:/blueprints/custom:ro
      - authentik-branding:/media/public:ro
      - authentik-templates:/templates:ro
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${AUTHENTIK_PORT:-9010}:9000'
    networks:
      default:
      public:
        aliases: [trifylli-sso]
    depends_on:
      config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: always
    <<: *logging
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-media:/media
      - authentik-blueprints:/blueprints/custom:ro
      - authentik-branding:/media/public:ro
      # Τα email τα στέλνει ο worker — χωρίς αυτό δεν βλέπει τα πρότυπα.
      - authentik-templates:/templates:ro
    depends_on:
      config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ─────────────────────── Object storage (Garage) ───────────────────────
  # S3-compatible αποθήκευση αρχείων (αποδείξεις, εικόνες markdown).
  garage:
    image: dxflrs/garage:v1.1.0
    restart: always
    <<: *logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    volumes:
      - garage-config:/etc/garage:ro
      - garage-data:/var/lib/garage
    depends_on:
      config:
        condition: service_completed_successfully
    # Καμία θύρα προς τον host — το API το φτάνει μέσα από το δίκτυο.

  # One-shot: layout + bucket + σταθερό key (idempotent).
  garage-init:
    # Το dxflrs/garage δεν έχει shell· το image `config` έχει το ίδιο binary
    # πάνω σε alpine και το (idempotent) bootstrap.
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    # Λίγες επαναλήψεις, όχι άπειρες: με λάθος ρύθμιση το `up` πρέπει να
    # αποτύχει με μήνυμα, όχι να περιμένει για πάντα (το api εξαρτάται από εδώ).
    restart: on-failure:3
    <<: *logging
    command: ['garage-init']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - garage-data:/var/lib/garage
    depends_on:
      - garage

  # ─────────────── Αντίγραφο πριν από τα migrations (one-shot) ───────────────
  # Dump όλων των βάσεων σε κάθε `up`, ΠΡΙΝ από το `migrate`: ένα migration που
  # σβήνει στήλες δεν αναιρείται, ένα dump ναι. Δικό του volume (γράφει ως root
  # χωρίς capabilities — δεν μπορεί να γράψει στον φάκελο του `backup`).
  # Είναι και το εργαλείο επαναφοράς (`restore-db`): έχει τη σύνδεση στη βάση και
  # βλέπει, μόνο για ανάγνωση, και τα ημερήσια dumps — βλ. docs/restore.md.
  predeploy-backup:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: 'no'
    <<: [*logging, *hardened]
    command: ['predeploy-backup']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-trifylli}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Και όσες προαιρετικές υπάρχουν (umami — profile analytics)· οι ανύπαρκτες παραλείπονται.
      DATABASES: ${POSTGRES_DB:-trifylli},${AUTHENTIK_DB:-authentik},${OUCHTRACKER_DB:-ouchtracker},umami
      PREDEPLOY_KEEP_DAYS: ${PREDEPLOY_KEEP_DAYS:-30}
    volumes:
      - postgres-predeploy:/backups/predeploy
      - postgres-backups:/backups/pg:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────── Migrations (one-shot) ───────────────────
  # Τρέχει `prisma migrate deploy` και τερματίζει. Το API ΔΕΝ ξεκινά πριν
  # ολοκληρωθεί, ώστε κάθε deploy να φέρνει τη βάση στο σωστό σχήμα πρώτα.
  # Μετά, σε άδεια βάση, φτιάχνει το Τοπικό, τους κλάδους και την τρέχουσα χρονιά.
  migrate:
    image: ghcr.io/athamour1/trifylli/api:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: 'no'
    <<: [*logging, *hardened]
    working_dir: /repo/apps/api
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/bootstrap.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trifylli}?schema=public
      TOPIKO_NAME: ${TOPIKO_NAME:-}
      TOPIKO_LOCATION: ${TOPIKO_LOCATION:-}
      TOPIKO_ESEO_CODE: ${TOPIKO_ESEO_CODE:-}
      SYNDROMI_AMOUNT: ${SYNDROMI_AMOUNT:-0}
    depends_on:
      postgres:
        condition: service_healthy
      predeploy-backup:
        condition: service_completed_successfully

  # ─────────────────────────── API ────────────────────────────
  api:
    image: ghcr.io/athamour1/trifylli/api:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: always
    <<: [*logging, *hardened]
    # Τρέχει ως `node` (>1024 port), δεν γράφει στον δίσκο: read-only root,
    # μόνο /tmp σε μνήμη.
    read_only: true
    tmpfs:
      - /tmp
    # Όριο μνήμης: η συνεργασία κρατά τα ανοιχτά κοινά έγγραφα στη μνήμη του API.
    # Μετρήθηκε (docs/synergasia.md, Φ6): ~115 MiB σε ηρεμία, ~135 MiB με 30 που
    # γράφουν μαζί. Το V8 μαζεύει σκουπίδια πριν φτάσει το όριο του container.
    mem_limit: ${API_MEM_LIMIT:-768m}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trifylli}?schema=public
      # Το origin του browser (του reverse proxy), π.χ. https://app.trifylli.gr
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Πρέπει να ταιριάζει ΑΚΡΙΒΩΣ με τον issuer του token (δημόσιο URL Authentik).
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-trifylli-pwa}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
      # Admin API του Authentik — για το email ορισμού/επαναφοράς κωδικού που
      # στέλνει το `/accounts`. Το token φτιάχνεται στο Authentik (Directory →
      # Tokens) σε λογαριασμό με δικαίωμα διαχείρισης χρηστών. Χωρίς αυτό οι
      # λογαριασμοί δημιουργούνται κανονικά, αλλά κανένα email δεν φεύγει.
      AUTHENTIK_API_URL: ${AUTHENTIK_API_URL:-http://authentik-server:9000}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?AUTHENTIK_API_TOKEN is required (openssl rand -hex 32)}
      # Ένας reverse proxy μπροστά: το API εμπιστεύεται ΕΝΑ hop X-Forwarded-For
      # για την IP πελάτη (rate limiting, logs). Όχι `true` — θα ήταν spoofable.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Το Swagger είναι ο χάρτης του API· κλειστό εκτός αν το ανοίξεις ρητά.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # ── Αποθήκευση αρχείων (Garage S3) ──
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-trifylli}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'true'
      # ── Προαιρετικές ενσωματώσεις ──
      # Το OuchTracker ζει στην ίδια στοίβα — εσωτερικό όνομα υπηρεσίας.
      OUCHTRACKER_BASE_URL: ${OUCHTRACKER_BASE_URL:-http://ouchtracker-backend:3000}
      OUCHTRACKER_EMAIL: ${OUCHTRACKER_EMAIL:-}
      OUCHTRACKER_PASSWORD: ${OUCHTRACKER_PASSWORD:-}
      ESEO_BASE_URL: ${ESEO_BASE_URL:-}
      ESEO_REALM: ${ESEO_REALM:-eseo}
      ESEO_CLIENT_ID: ${ESEO_CLIENT_ID:-ssoClient}
      ESEO_REFRESH_TOKEN: ${ESEO_REFRESH_TOKEN:-}
      ESEO_WEBHOOK_SECRET: ${ESEO_WEBHOOK_SECRET:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      # Error tracking (GlitchTip, profile `errors`): το DSN του project «API».
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      # Tracing, logs, breadcrumbs όσο το σύστημα είναι σε ενεργή ανάπτυξη —
      # κλείνουν (`false`) πριν από την κανονική παραγωγή, ROADMAP §6.
      SENTRY_EXTRAS: ${SENTRY_EXTRAS:-true}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1}
      # Παραβιάσεις CSP της PWA → «Security Endpoint» του project «PWA».
      CSP_REPORT_FORWARD_URL: ${CSP_REPORT_FORWARD_URL:-}
      # Web Push (ειδοποιήσεις στο κινητό) — τα κλειδιά τα βγάζει το gen-env.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Email: οι σύνδεσμοι εντύπων/αξιολόγησης προς γονείς — ο ίδιος SMTP με το Authentik.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30}
      SMTP_FROM: ${SMTP_FROM:-}
      # Heartbeats των crons — ένα URL ανά εργασία (βλ. docs/monitoring.md).
      HEARTBEAT_ESEO_SYNC_URL: ${HEARTBEAT_ESEO_SYNC_URL:-}
      HEARTBEAT_HEALTH_PURGE_URL: ${HEARTBEAT_HEALTH_PURGE_URL:-}
      HEARTBEAT_IMAGE_SWEEP_URL: ${HEARTBEAT_IMAGE_SWEEP_URL:-}
      HEARTBEAT_PHARMACY_RETURNS_URL: ${HEARTBEAT_PHARMACY_RETURNS_URL:-}
      HEARTBEAT_PHARMACY_ACCESS_URL: ${HEARTBEAT_PHARMACY_ACCESS_URL:-}
      HEARTBEAT_DRASI_REMINDERS_URL: ${HEARTBEAT_DRASI_REMINDERS_URL:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${API_PORT:-3000}:3000'
    networks:
      default:
      public:
        aliases: [trifylli-api]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully

  # ─────────────────────────── Web (PWA) ──────────────────────
  web:
    image: ghcr.io/athamour1/trifylli/web:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: always
    <<: *logging
    security_opt:
      - no-new-privileges:true
    # Το nginx ξεκινά ως root μόνο για να δέσει την :80 και να αλλάξει σε
    # `nginx`: μόνο αυτές οι τέσσερις ικανότητες, τίποτα άλλο.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    # Ρυθμίσεις runtime (ο entrypoint γράφει το /config.js) — ίδια image για κάθε
    # περιβάλλον, καμία ανάγκη rebuild όταν αλλάζει ένα URL.
    environment:
      API_URL: ${VITE_API_URL:?VITE_API_URL is required (π.χ. https://api.trifylli.gr/api)}
      OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:?VITE_OIDC_AUTHORITY is required}
      OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-trifylli-pwa}
      OIDC_LOGOUT_FLOW: ${VITE_OIDC_LOGOUT_FLOW:-trifylli-invalidation}
      # URL του OuchTracker — στόχος των deep-links των φαρμακείων.
      OUCHTRACKER_URL: ${VITE_OUCHTRACKER_URL:-}
      # Error tracking (GlitchTip): το DSN του project «PWA» — μπαίνει και στο CSP.
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_EXTRAS: ${SENTRY_EXTRAS:-true}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1}
      # Source maps της PWA στο GlitchTip, σε κάθε εκκίνηση: token με
      # `project:releases`, και το ΔΗΜΟΣΙΟ URL του GlitchTip.
      SOURCEMAP_UPLOAD_URL: ${GLITCHTIP_DOMAIN:-}
      SOURCEMAP_UPLOAD_TOKEN: ${SOURCEMAP_UPLOAD_TOKEN:-}
      SOURCEMAP_UPLOAD_ORG: ${SOURCEMAP_UPLOAD_ORG:-trifylli}
      SOURCEMAP_UPLOAD_PROJECT: ${SOURCEMAP_UPLOAD_PROJECT:-pwa}
      # Καταγραφή συνεδριών (profile replay — ROADMAP §6) και ανώνυμα analytics
      # (profile analytics): μπαίνουν και στο CSP. Κενά = ανενεργά.
      OPENREPLAY_URL: ${REPLAY_URL:-}
      OPENREPLAY_PROJECT_KEY: ${OPENREPLAY_PROJECT_KEY:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80'
    networks:
      default:
      public:
        aliases: [trifylli-web]
    depends_on:
      - api

  # ─────────────────── Αντίγραφα ασφαλείας βάσης ───────────────────
  # Καθημερινό pg_dump όλων των βάσεων (Trifylli, Authentik, OuchTracker) σε
  # ξεχωριστό volume, με περιστροφή. Το volume πρέπει να συγχρονίζεται ΕΚΤΟΣ
  # διακομιστή (rclone/restic/rsync) — ένα backup στον ίδιο δίσκο με τη βάση
  # προστατεύει από λάθος `DELETE`, όχι από χαμένο δίσκο. Επαναφορά:
  #   zcat backups/daily/trifylli-*.sql.gz | docker compose exec -T postgres psql -U trifylli trifylli
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: always
    <<: [*logging, *hardened]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-trifylli},${AUTHENTIK_DB:-authentik},${OUCHTRACKER_DB:-ouchtracker}
      POSTGRES_USER: ${POSTGRES_USER:-trifylli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_EXTRA_OPTS: '-Z6 --blobs'
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      # Κανένα αντίγραφο πάνω από 30 ημέρες (τα εβδομαδιαία σβήνονται στις 4×7+1):
      # η φόρμα υγείας λέει στους γονείς ότι τα ιατρικά φεύγουν και από τα
      # αντίγραφα μέσα σε 30 ημέρες (BACKUP_RETENTION_DAYS στο shared).
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-0}
      HEALTHCHECK_PORT: 8080
      # Heartbeat (Healthchecks / Uptime Kuma): ok μετά από κάθε dump, fail στο σφάλμα.
      HEARTBEAT_URL: ${HEARTBEAT_BACKUP_URL:-}
    volumes:
      - postgres-backups:/backups
      # Το δικό μας hook (50-heartbeat) αντί για το webhook του image, που καλεί
      # το ίδιο URL και στην αποτυχία — ένα heartbeat θα την περνούσε για επιτυχία.
      - backup-hooks:/hooks:ro
    depends_on:
      config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ─────────────────── Αντίγραφα εκτός server (restic) ───────────────────
  # Μία φορά τη μέρα: τα dumps (`backup` + `predeploy-backup`) και τα αρχεία του
  # Garage (μέσω S3) → κρυπτογραφημένο αποθετήριο restic ΕΚΤΟΣ server, με
  # διατήρηση το πολύ 30 ημέρες. Χωρίς RESTIC_REPOSITORY η στοίβα σηκώνεται
  # κανονικά, αλλά αυτό μένει «unhealthy» και το γράφει στα logs κάθε μέρα.
  # Χειροκίνητα: docker compose … exec backup-offsite offsite-backup once
  backup-offsite:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: always
    <<: [*logging, *hardened]
    command: ['offsite-backup']
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      # Διαπιστευτήρια του προορισμού — ό,τι χρειάζεται ο τύπος του αποθετηρίου.
      AWS_ACCESS_KEY_ID: ${RESTIC_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_AWS_SECRET_ACCESS_KEY:-}
      RESTIC_SSH_KEY_B64: ${RESTIC_SSH_KEY_B64:-}
      # Heartbeat μετά από κάθε προσπάθεια: ok, ή fail (και όταν δεν έχει οριστεί προορισμός).
      HEARTBEAT_URL: ${HEARTBEAT_OFFSITE_URL:-}
      # Η πηγή των αρχείων: το Garage της στοίβας, μέσω S3.
      RCLONE_S3_PROVIDER: Other
      RCLONE_S3_ENDPOINT: http://garage:3900
      RCLONE_S3_REGION: ${S3_REGION:-garage}
      RCLONE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RCLONE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      RCLONE_S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET: ${S3_BUCKET:-trifylli}
    volumes:
      - postgres-backups:/backups/pg:ro
      - postgres-predeploy:/backups/predeploy:ro
      - garage-mirror:/mirror
      - offsite-state:/state
    # «unhealthy» = κανένα επιτυχημένο αντίγραφο τις τελευταίες 30 ώρες (ή κανένας
    # προορισμός). Οι πρώτες 3 ώρες δεν μετράνε: η πρώτη προσπάθεια είναι στα 10'.
    healthcheck:
      test: ['CMD', 'offsite-backup', 'health']
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 3h
    depends_on:
      garage-init:
        condition: service_completed_successfully

  # ─────────────────── Watchdog ───────────────────
  # Κάθε 5': δίσκος (≥ DISK_ALERT_PERCENT) και υγεία postgres/redis/garage/api/web/
  # authentik → heartbeat. Το heartbeat είναι και ο «νεκρός διακόπτης»: αν πέσει ο
  # server ή το internet, σταματούν τα pings και η εξωτερική υπηρεσία ειδοποιεί.
  # Δοκιμή: docker compose … exec watchdog watchdog once
  watchdog:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    restart: always
    <<: [*logging, *hardened]
    command: ['watchdog']
    environment:
      HEARTBEAT_URL: ${HEARTBEAT_WATCHDOG_URL:-}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-300}
    volumes:
      - watchdog-state:/state

  # ─────────────────── Error tracking (GlitchTip) — profile `errors` ───────────────────
  # Προαιρετικό: COMPOSE_PROFILES=errors. Δέχεται τα σφάλματα του API και της PWA
  # (Sentry SDK — βλ. API_SENTRY_DSN / WEB_SENTRY_DSN). Δική του βάση στην ίδια
  # Postgres, δικό του index στη Redis· στο `trifylli-public` ως `trifylli-errors`,
  # γιατί η PWA στέλνει από τον browser. Η εγγραφή είναι κλειστή — πρώτος χρήστης:
  #   docker compose … exec glitchtip ./manage.py createsuperuser
  glitchtip-db:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    profiles: [errors]
    restart: 'no'
    <<: [*logging, *hardened]
    command: ['ensure-db', '${GLITCHTIP_DB:-glitchtip}']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-trifylli}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-6.2.6}
    profiles: [errors]
    restart: always
    <<: [*logging, *hardened]
    environment:
      # Web + worker στο ίδιο container· κάνει μόνο του τα migrations.
      SERVER_ROLE: all_in_one
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${GLITCHTIP_DB:-glitchtip}
      VALKEY_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      # Το δημόσιο URL (π.χ. https://errors.trifylli.gr) — από εκεί βγαίνουν τα DSN.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-}
      DEFAULT_FROM_EMAIL: ${SMTP_FROM:?SMTP_FROM is required}
      # Για ειδοποιήσεις σφαλμάτων με email, π.χ. smtp+tls://χρήστης:κωδικός@smtp.example.gr:587
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: 'false'
      # Όπως τα backups: τίποτα πάνω από 30 ημέρες.
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
      # DuckDB: τα spans του tracing (και τα logs) θέλουν την «ψυχρή» αποθήκη.
      GLITCHTIP_ENABLE_DUCKDB: 'true'
      GLITCHTIP_COLD_STORAGE_DIR: /code/uploads/cold
      # MCP: διαλογή σφαλμάτων από το Claude Code — μόνο όσο είμαστε σε ανάπτυξη (ROADMAP §6).
      GLITCHTIP_ENABLE_MCP: ${GLITCHTIP_ENABLE_MCP:-true}
    volumes:
      - glitchtip-uploads:/code/uploads
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${GLITCHTIP_PORT:-8082}:8000'
    networks:
      default:
      public:
        aliases: [trifylli-errors]
    depends_on:
      glitchtip-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # «Log in with Authentik»: ο OIDC provider του GlitchTip από το περιβάλλον, και
  # κάθε χρήστης του δεμένος με τον λογαριασμό του Authentik με το ίδιο email
  # (infra/glitchtip/configure-sso.py, από το config image) — σε κάθε `up`.
  # Ο client στο Authentik: infra/authentik/glitchtip-oidc.yaml.
  glitchtip-sso:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-6.2.6}
    profiles: [errors]
    restart: 'no'
    <<: [*logging, *hardened]
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${GLITCHTIP_DB:-glitchtip}
      VALKEY_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-}
      GLITCHTIP_OIDC_ISSUER: ${GLITCHTIP_OIDC_ISSUER:-}
      GLITCHTIP_OIDC_CLIENT_SECRET: ${GLITCHTIP_OIDC_CLIENT_SECRET:-}
    volumes:
      - glitchtip-config:/opt/glitchtip:ro
    entrypoint: ['sh', '-c', './manage.py shell < /opt/glitchtip/configure-sso.py']
    depends_on:
      config:
        condition: service_completed_successfully
      glitchtip:
        condition: service_started

  # ─────────────────── OuchTracker (φαρμακεία) ───────────────────
  # Μοιράζεται Postgres (δική του βάση), Authentik (SSO) και το ίδιο domain
  # (υποτομέας) με το Trifylli. Το backend κάνει μόνο του migrate+seed στην
  # εκκίνηση (βλ. Dockerfile CMD). Χτίζεται από το γειτονικό repo `../OuchTracker`.
  ouchtracker-backend:
    image: ghcr.io/athamour1/ouchtracker/backend:${OUCHTRACKER_TAG:-latest}
    restart: always
    <<: *logging
    # Το nginx του frontend κάνει proxy στο `http://backend:3000` — δίνουμε
    # alias ώστε να μη χρειάζεται αλλαγή στο OuchTracker.
    networks:
      default:
        aliases:
          - backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${OUCHTRACKER_DB:-ouchtracker}?schema=public
      CORS_ORIGIN: ${OUCHTRACKER_CORS_ORIGIN:?OUCHTRACKER_CORS_ORIGIN is required (π.χ. https://ouch.trifylli.gr)}
      JWT_SECRET: ${OUCHTRACKER_JWT_SECRET:?OUCHTRACKER_JWT_SECRET is required}
      JWT_EXPIRES_IN: ${OUCHTRACKER_JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${OUCHTRACKER_SEED_ADMIN_EMAIL:-admin@ouchtracker.local}
      SEED_ADMIN_PASSWORD: ${OUCHTRACKER_SEED_ADMIN_PASSWORD:?OUCHTRACKER_SEED_ADMIN_PASSWORD is required}
      SEED_ADMIN_NAME: ${OUCHTRACKER_SEED_ADMIN_NAME:-System Admin}
      # ── Single sign-on (ίδιο Authentik με το Trifylli) ──
      OIDC_ISSUER: ${OUCHTRACKER_OIDC_ISSUER:?OUCHTRACKER_OIDC_ISSUER is required (π.χ. https://id.trifylli.gr/application/o/ouchtracker/)}
      OIDC_AUDIENCE: ${OUCHTRACKER_OIDC_AUDIENCE:-ouchtracker}
      OIDC_JWKS_URI: ${OUCHTRACKER_OIDC_JWKS_URI:-http://authentik-server:9000/application/o/ouchtracker/jwks/}
      OIDC_ADMIN_EMAILS: ${OUCHTRACKER_OIDC_ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy

  ouchtracker-frontend:
    image: ghcr.io/athamour1/ouchtracker/frontend:${OUCHTRACKER_TAG:-latest}
    restart: always
    <<: *logging
    environment:
      # Το nginx κάνει proxy /api → backend· σχετικό URL στο ίδιο origin.
      API_URL: ${OUCHTRACKER_API_URL:-/api}
      OIDC_AUTHORITY: ${OUCHTRACKER_OIDC_ISSUER:?OUCHTRACKER_OIDC_ISSUER is required}
      OIDC_CLIENT_ID: ${OUCHTRACKER_OIDC_CLIENT_ID:-ouchtracker}
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${OUCHTRACKER_WEB_PORT:-8081}:80'
    networks:
      default:
      public:
        aliases: [trifylli-ouch]
    depends_on:
      - ouchtracker-backend

  # ─────────────────── Analytics (Umami) — profile `analytics` ───────────────────
  # Προαιρετικό: COMPOSE_PROFILES=…,analytics. Ανώνυμα στατιστικά επισκέψεων,
  # χωρίς cookies· βάση `umami` στον ίδιο Postgres. Πρώτη είσοδος admin / umami —
  # άλλαξέ τον αμέσως. Στο trifylli-public ως `trifylli-analytics` (ο browser
  # κατεβάζει το script και στέλνει τις επισκέψεις). Μόνιμο — όχι από τα extras.
  umami-db:
    image: ghcr.io/athamour1/trifylli/config:${TAG:?TAG is required (π.χ. v1.1.0)}
    profiles: [analytics]
    restart: 'no'
    <<: [*logging, *hardened]
    command: ['ensure-db', 'umami']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-trifylli}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-3.4.0}
    profiles: [analytics]
    restart: always
    <<: [*logging, *hardened]
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: '1'
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${UMAMI_PORT:-8083}:3000'
    networks:
      default:
      public:
        aliases: [trifylli-analytics]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      umami-db:
        condition: service_completed_successfully

  # ─────────────────── Session replay (OpenReplay) — profile `replay` ───────────────────
  # Προαιρετικό: COMPOSE_PROFILES=…,replay. ~20 containers, ≥ 8 GB RAM. Δικό του
  # δίκτυο (`replay`): τα ονόματα των υπηρεσιών του (redis, postgresql, minio) θα
  # συγκρούονταν με τα δικά μας. Βγαίνει έξω μόνο ο replay-nginx, ως
  # `trifylli-replay` στο trifylli-public. Πρώτος λογαριασμός: ο πρώτος που
  # γράφεται στο UI γίνεται owner — docs/monitoring.md §5. Εγγραφές: 30 ημέρες.
  # Δεν μπαίνει στα backups (εγγραφές μιας χρήσης).
  replay-fs-permission:
    image: debian:stable-slim
    profiles: [replay]
    restart: 'no'
    <<: *logging
    volumes:
      - replay-shared:/mnt/efs
      - replay-minio:/mnt/minio
      - replay-postgres:/mnt/postgres
    entrypoint: ['/bin/bash', '-c', 'chown -R 1001:1001 /mnt/efs /mnt/postgres && chown -R 10001:10001 /mnt/minio']

  replay-postgres:
    image: ghcr.io/openreplay/postgres:17
    profiles: [replay]
    restart: always
    <<: *logging
    volumes:
      - replay-postgres:/bitnami/postgresql
    networks:
      replay:
        aliases: [postgresql, postgresql.db.svc.cluster.local]
    environment:
      POSTGRESQL_PASSWORD: ${REPLAY_PG_PASSWORD:-}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      replay-fs-permission:
        condition: service_completed_successfully

  replay-clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    profiles: [replay]
    restart: always
    <<: *logging
    volumes:
      - replay-clickhouse:/var/lib/clickhouse
    networks:
      replay:
        aliases: [clickhouse, clickhouse-openreplay-clickhouse.db.svc.cluster.local]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    healthcheck:
      test: ['CMD-SHELL', "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  replay-redis:
    image: ghcr.io/openreplay/valkey:8
    profiles: [replay]
    restart: always
    <<: *logging
    volumes:
      - replay-redis:/data
    networks:
      replay:
        aliases: [redis, redis-master.db.svc.cluster.local]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  replay-minio:
    image: docker.io/rustfs/rustfs:1.0.0-beta.1
    profiles: [replay]
    restart: always
    <<: *logging
    volumes:
      - replay-minio:/data
    networks:
      replay:
        aliases: [minio, minio.db.svc.cluster.local]
    environment:
      RUSTFS_ACCESS_KEY: ${REPLAY_S3_KEY:-}
      RUSTFS_SECRET_KEY: ${REPLAY_S3_SECRET:-}
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ['CMD-SHELL', 'curl -so /dev/null http://localhost:9000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      replay-fs-permission:
        condition: service_completed_successfully

  # Buckets (+ διαγραφή εγγραφών στις 30 ημέρες) και σχήματα βάσεων — σε κάθε
  # `up`· ασφαλή στην επανάληψη. Τα αρχεία έρχονται από το config image.
  replay-minio-init:
    image: ghcr.io/openreplay/minio:2025
    profiles: [replay]
    restart: 'no'
    <<: *logging
    user: root
    networks: [replay]
    volumes:
      - openreplay-config:/opt/openreplay:ro
    environment:
      MINIO_HOST: http://minio.db.svc.cluster.local:9000
      MINIO_ACCESS_KEY: ${REPLAY_S3_KEY:-}
      MINIO_SECRET_KEY: ${REPLAY_S3_SECRET:-}
    entrypoint: ['/bin/bash', '/opt/openreplay/minio.sh', 'init']
    depends_on:
      config:
        condition: service_completed_successfully
      replay-minio:
        condition: service_healthy

  replay-db-init:
    image: ghcr.io/openreplay/postgres:17
    profiles: [replay]
    restart: 'no'
    <<: *logging
    networks: [replay]
    volumes:
      - openreplay-config:/opt/openreplay:ro
    environment:
      PGHOST: postgresql
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${REPLAY_PG_PASSWORD:-}
    entrypoint: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/opt/openreplay/init_pg_schema.sql']
    depends_on:
      replay-postgres:
        condition: service_healthy
      replay-minio-init:
        condition: service_completed_successfully

  replay-ch-init:
    image: clickhouse/clickhouse-server:26.2-alpine
    profiles: [replay]
    restart: 'no'
    <<: *logging
    networks: [replay]
    volumes:
      - openreplay-config:/opt/openreplay:ro
    entrypoint: ['/bin/sh', '-c', 'clickhouse-client -h clickhouse --user default --port 9000 --multiquery < /opt/openreplay/init_ch_schema.sql || true']
    depends_on:
      config:
        condition: service_completed_successfully
      replay-clickhouse:
        condition: service_healthy

  replay-nginx:
    image: nginx:1.27-alpine
    profiles: [replay]
    restart: always
    <<: *logging
    volumes:
      - openreplay-config:/opt/openreplay:ro
    environment:
      REPLAY_LISTEN_PORT: '80'
      NGINX_ENVSUBST_TEMPLATE_DIR: /opt/openreplay
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${REPLAY_PORT:-8090}:80'
    networks:
      replay:
        aliases: [nginx]
      public:
        aliases: [trifylli-replay]
    depends_on:
      config:
        condition: service_completed_successfully

  replay-alerts:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/alerts:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [alerts-openreplay, alerts-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      EMAIL_HOST: '${SMTP_HOST:-}'
      EMAIL_PORT: '${SMTP_PORT:-587}'
      EMAIL_USER: '${SMTP_USERNAME:-}'
      EMAIL_PASSWORD: '${SMTP_PASSWORD:-}'
      EMAIL_USE_TLS: '${SMTP_USE_TLS:-true}'
      EMAIL_USE_SSL: '${SMTP_USE_SSL:-false}'
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: '${SMTP_FROM:-}'

  replay-api:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/api:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [api-openreplay, api-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: '${REPLAY_TOKEN_SECRET_API:-}'
      REDIS_CACHE_ENABLED: 'false'

  replay-images:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/images:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [images-openreplay, images-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: '${REPLAY_TOKEN_SECRET:-}'
      FS_CLEAN_HRS: '24'

  replay-sink:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/sink:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [sink-openreplay, sink-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-sourcemapreader:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/sourcemapreader:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [sourcemapreader-openreplay, sourcemapreader-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      SMR_HOST: '0.0.0.0'
      S3_HOST: 'http://minio.db.svc.cluster.local:9000'

  replay-spot:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/spot:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [spot-openreplay, spot-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: spots
      TOKEN_SECRET: '${REPLAY_TOKEN_SECRET_API:-}'
      CACHE_ASSETS: 'true'
      FS_CLEAN_HRS: '24'

  replay-storage:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/storage:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [storage-openreplay, storage-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      FS_CLEAN_HRS: '24'

  replay-assets:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/assets:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [assets-openreplay, assets-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: sessions-assets

  replay-assist:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/assist:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [assist-openreplay, assist-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      REDIS_URL: redis-master.db.svc.cluster.local
      CLEAR_SOCKET_TIME: '720'
      MAX_BACKPRESSURE_KB: '128'
      debug: '0'
      redis: 'false'

  replay-canvases:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/canvases:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [canvases-openreplay, canvases-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: '${REPLAY_TOKEN_SECRET:-}'
      FS_CLEAN_HRS: '24'

  replay-chalice:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/chalice:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [chalice-openreplay, chalice-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      EMAIL_HOST: '${SMTP_HOST:-}'
      EMAIL_PORT: '${SMTP_PORT:-587}'
      EMAIL_USER: '${SMTP_USERNAME:-}'
      EMAIL_PASSWORD: '${SMTP_PASSWORD:-}'
      EMAIL_USE_TLS: '${SMTP_USE_TLS:-true}'
      EMAIL_USE_SSL: '${SMTP_USE_SSL:-false}'
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: '${SMTP_FROM:-}'
      sourcemaps_reader: 'http://sourcemapreader-openreplay.app.svc.cluster.local:9000/{}/sourcemaps'
      CLUSTER_URL: svc.cluster.local
      JWT_EXPIRATION: '86400'
      jwt_algorithm: HS512
      root_path: /api
      sessions_region: us-east-1
      ASSIST_RECORDS_BUCKET: records
      sessions_bucket: mobs
      IOS_VIDEO_BUCKET: mobs
      sourcemaps_bucket: sourcemaps
      js_cache_bucket: sessions-assets
      CH_COMPRESSION: 'false'
      SCIM_ACCESS_SECRET_KEY: '${REPLAY_SCIM_SECRET:-}'
      SCIM_REFRESH_SECRET_KEY: '${REPLAY_SCIM_SECRET:-}'
      SCIM_ACCESS_TOKEN_EXPIRE_SECONDS: '86400'
      SAML2_MD_URL: ''
      announcement_url: ''
      assist_secret: ''
      async_Token: ''
      captcha_key: ''
      captcha_server: ''
      iceServers: ''

  replay-db:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/db:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [db-openreplay, db-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-ender:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/ender:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [ender-openreplay, ender-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-frontend:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/frontend:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [frontend-openreplay, frontend-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      TRACKER_HOST: '${REPLAY_URL:-}/script'
      HTTP_PORT: '80'

  replay-http:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/http:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [http-openreplay, http-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: uxtesting-records
      TOKEN_SECRET: '${REPLAY_TOKEN_SECRET:-}'
      CACHE_ASSETS: 'true'

# Δύο δίκτυα με σταθερά subnets (τα ζητά το TRUSTED_PROXY_CIDRS του Authentik):
#   default  — όλη η στοίβα, και οι βάσεις.
#   public   — ΜΟΝΟ web/api/sso/ouch. Εδώ συνδέεται ένας reverse proxy που τρέχει
#              σε Docker (Zoraxy, Nginx Proxy Manager, Traefik), μία φορά:
#                docker network connect trifylli-public <container του proxy>
#              και στοχεύει trifylli-web:80, trifylli-api:3000, trifylli-sso:9000,
#              trifylli-ouch:80 — χωρίς καμία θύρα στο LAN και χωρίς να βλέπει
#              ποτέ Postgres/Redis/Garage.
# Αν τα subnets συγκρούονται με άλλα δίκτυα του host, άλλαξε STACK_SUBNET/PUBLIC_SUBNET.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.97.50.0/24}
  public:
    name: trifylli-public
    ipam:
      config:
        - subnet: ${PUBLIC_SUBNET:-10.97.51.0/24}
  # Το εσωτερικό δίκτυο του OpenReplay (profile replay) — βλ. replay-nginx.
  replay:
    ipam:
      config:
        - subnet: ${REPLAY_SUBNET:-10.97.52.0/24}

volumes:
  # Γράφονται από τον `config` σε κάθε `up` — μην τα πειράζεις με το χέρι.
  authentik-blueprints:
  authentik-branding:
  authentik-templates:
  postgres-init:
  garage-config:
  backup-hooks:
  openreplay-config:
  glitchtip-config:
  # Δεδομένα.
  postgres-backups:
  postgres-predeploy:
  # Καθρέφτης του Garage για το restic, και η κατάστασή του (cache, «τελευταία επιτυχία»).
  garage-mirror:
  offsite-state:
  glitchtip-uploads:
  watchdog-state:
  postgres-data:
  redis-data:
  authentik-media:
  garage-data:
  # OpenReplay (profile replay): εγγραφές και οι βάσεις τους — εκτός backups.
  replay-postgres:
  replay-clickhouse:
  replay-redis:
  replay-minio:
  replay-shared:
