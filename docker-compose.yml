# Περιβάλλον ανάπτυξης Trifylli.
#
# Το `pnpm infra:up` σηκώνει μόνο τις υποδομές (Postgres, Redis, Authentik) και
# αφήνει API/PWA να τρέχουν τοπικά με hot reload. Για πλήρη στοίβα σε container:
#   docker compose --profile full up -d

name: trifylli

# Όλες οι θύρες δένονται στο `DEV_BIND_ADDR` (default 127.0.0.1): η στοίβα
# ανάπτυξης τρέχει με default κωδικούς και ΔΕΝ πρέπει να ακούει σε κοινό Wi-Fi.
# Για δοκιμή από κινητό στο ίδιο δίκτυο: `DEV_BIND_ADDR=0.0.0.0` στο .env —
# συνειδητά και προσωρινά.

# ─────────────────── OpenReplay (session replay) — profile: replay ───────────────────
# Οι μεταβλητές που μοιράζονται όλα τα services του OpenReplay (βάσεις, S3,
# μυστικά). Ό,τι αφορά ένα μόνο service (HTTP_PORT, BUCKET_NAME, …) μένει σε
# εκείνο: σε άλλο θα άλλαζε τη συμπεριφορά του. Πρότυπο: infra/openreplay/README.md.
x-replay-env: &replay-env
  version_number: v1.28.0
  LICENSE_KEY: ''
  LOGLEVEL: INFO
  PYTHONUNBUFFERED: '0'
  SITE_URL: &replay-url http://replay.localhost:8090
  pg_host: postgresql.db.svc.cluster.local
  pg_port: '5432'
  pg_dbname: postgres
  pg_user: postgres
  pg_password: trifylli-dev-replay
  POSTGRES_STRING: postgres://postgres:trifylli-dev-replay@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
  REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379
  ch_host: clickhouse-openreplay-clickhouse.db.svc.cluster.local
  ch_port: '9000'
  ch_port_http: '8123'
  ch_username: default
  ch_user: default
  ch_password: ''
  ch_db: default
  CH_USERNAME: default
  CH_PASSWORD: ''
  CLICKHOUSE_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:9000/default
  CLICKHOUSE_HTTP_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:8123/default
  KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
  KAFKA_USE_SSL: 'false'
  # Οι υπηρεσίες μιλούν με το S3 μέσω του δημόσιου URL (ο nginx τους το
  # προωθεί στο RustFS) — γι' αυτό το `replay.localhost` είναι alias του nginx.
  AWS_ENDPOINT: *replay-url
  S3_HOST: *replay-url
  AWS_ACCESS_KEY_ID: trifylli-dev-replay-s3
  AWS_SECRET_ACCESS_KEY: trifylli-dev-replay-s3-secret
  S3_KEY: trifylli-dev-replay-s3
  S3_SECRET: trifylli-dev-replay-s3-secret
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  JWT_SECRET: trifylli-dev-replay-jwt
  JWT_REFRESH_SECRET: trifylli-dev-replay-jwt-refresh
  JWT_SPOT_SECRET: trifylli-dev-replay-jwt-spot
  JWT_SPOT_REFRESH_SECRET: trifylli-dev-replay-jwt-spot-refresh
  ASSIST_JWT_SECRET: trifylli-dev-replay-assist-jwt
  ASSIST_KEY: trifylli-dev-replay-assist-key
  ASSIST_URL: http://assist-openreplay.app.svc.cluster.local:9001/assist/%s
  ASSETS_ORIGIN: http://replay.localhost:8090/sessions-assets

x-replay-app: &replay-app
  profiles: ['replay']
  restart: unless-stopped
  volumes:
    - replay-shared:/mnt/efs
  depends_on:
    replay-postgres:
      condition: service_healthy
    replay-redis:
      condition: service_healthy
    replay-clickhouse:
      condition: service_healthy
    replay-minio:
      condition: service_healthy
    replay-db-init:
      condition: service_completed_successfully
    replay-ch-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trifylli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trifylli}
      POSTGRES_DB: ${POSTGRES_DB:-trifylli}
      AUTHENTIK_DB: ${AUTHENTIK_DB:-authentik}
      OUCHTRACKER_DB: ${OUCHTRACKER_DB:-ouchtracker}
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trifylli} -d ${POSTGRES_DB:-trifylli}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────── Mailpit (SMTP ανάπτυξης) ───────────────────────
  # Ψεύτικος SMTP server με web UI: δέχεται ό,τι του στείλει το Authentik και το
  # δείχνει στο http://localhost:8025 αντί να το παραδώσει. Υποδομή και όχι
  # profile, γιατί χωρίς αυτόν η ανάκτηση κωδικού αποτυγχάνει σιωπηλά στο dev.
  # Τα μηνύματα ζουν στη μνήμη του container — ένα restart τα καθαρίζει, που
  # είναι ακριβώς ό,τι θέλουμε σε δοκιμές.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${DEV_BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────── Authentik (SSO) ───────────────────────
  # Η βάση του Authentik ζει στο ίδιο Postgres, σε ξεχωριστό database που
  # δημιουργείται από το init script.
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-in-production}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-trifylli}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-trifylli}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB:-authentik}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      # Σταθερό token διαχειριστή, ώστε η ρύθμιση να γίνεται από script αντί για
      # κλικ στο UI. Μόνο για development.
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      # ── Blueprint ασφάλειας (trifylli-security.yaml) ──
      # Το κλειδί του token που δίνεται στο service account `trifylli-api` — η
      # ΙΔΙΑ τιμή πηγαίνει και στο API ως AUTHENTIK_API_TOKEN.
      TRIFYLLI_API_TOKEN: ${AUTHENTIK_API_TOKEN:-trifylli-dev-api-token}
      # MFA όταν ο χρήστης δεν έχει authenticator: `skip` στο dev, `configure` σε prod.
      TRIFYLLI_MFA_NOT_CONFIGURED: ${AUTHENTIK_MFA_MODE:-skip}
      # ── Email (ανάκτηση κωδικού, ειδοποιήσεις) ──
      # Στο development ο SMTP είναι το Mailpit: τίποτα δεν φεύγει προς τα έξω
      # και κάθε μήνυμα φαίνεται στο http://localhost:8025. Έτσι η ροή
      # «ξέχασα τον κωδικό» δοκιμάζεται ολόκληρη, χωρίς πάροχο και χωρίς ρίσκο
      # να φτάσει δοκιμαστικό mail σε πραγματικό παραλήπτη.
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-mailpit}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-1025}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
      # Το Mailpit δέχεται σκέτο SMTP· στο prod ισχύει το αντίθετο (STARTTLS).
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: ${SMTP_TIMEOUT:-10}
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-Trifylli <noreply@trifylli.local>}
    volumes:
      - authentik-media:/media
      - ./infra/authentik:/blueprints/custom:ro
      # Εμφάνιση στα χρώματα του Trifylli: η οθόνη σύνδεσης είναι μέρος της
      # ίδιας διαδρομής, δεν πρέπει να μοιάζει με ξένο προϊόν. Τα αρχεία τα
      # βλέπει το Authentik ως `logo.svg`/`favicon.svg`/`login-scene.svg`
      # (τα ονόματα που δηλώνει το blueprint του brand).
      - ./infra/authentik/branding:/media/public:ro
      # Ελληνικά πρότυπα email (ορισμός κωδικού) — `email.template_dir`.
      - ./infra/authentik/email-templates:/templates:ro
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${AUTHENTIK_PORT:-9010}:9000'
    depends_on:
      postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-media:/media
      - ./infra/authentik:/blueprints/custom:ro
      - ./infra/authentik/branding:/media/public:ro
      # Τα email τα στέλνει ο worker — χωρίς αυτό δεν βλέπει τα πρότυπα.
      - ./infra/authentik/email-templates:/templates:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────── Object storage (Garage) ───────────────────────
  # S3-compatible αποθήκευση αρχείων (αποδείξεις κ.ά.). Υποδομή, όχι profile:
  # χρειάζεται και όταν το API τρέχει τοπικά.
  garage:
    image: dxflrs/garage:v1.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900'
      - '${DEV_BIND_ADDR:-127.0.0.1}:${GARAGE_ADMIN_PORT:-3903}:3903'

  # One-shot: αναθέτει layout, φτιάχνει bucket + σταθερό key (idempotent).
  garage-init:
    build:
      context: ./infra/garage
      dockerfile: Dockerfile
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      # Το admin CLI χρειάζεται το node key του κόμβου για το RPC handshake.
      - garage-data:/var/lib/garage
    depends_on:
      - garage
    restart: on-failure

  # ─────────────────── Πλήρης στοίβα (profile: full) ───────────────────
  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Στο dev το Swagger μένει ανοιχτό παρά το NODE_ENV=production (που εδώ
      # σημαίνει «χτισμένο bundle», όχι «ζωντανό σύστημα»).
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:-trifylli}@postgres:5432/${POSTGRES_DB:-trifylli}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Ο issuer πρέπει να ταιριάζει **ακριβώς** με αυτόν που βάζει το Authentik
      # στο token — δηλαδή το URL που βλέπει ο browser, όχι το εσωτερικό DNS.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:9010/application/o/trifylli/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-trifylli-pwa}
      # Το JWKS το κατεβάζει ο server, οπότε εδώ το εσωτερικό όνομα είναι εντάξει.
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://authentik-server:9000/application/o/trifylli/jwks/}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      # Admin API του Authentik: το API ζητά να σταλεί σύνδεσμος ορισμού κωδικού
      # όταν ο υπερδιαχειριστής φτιάχνει λογαριασμό. Εσωτερικό DNS. Το token
      # ανήκει στο service account `trifylli-api` με ελάχιστα δικαιώματα (το
      # φτιάχνει το blueprint trifylli-security.yaml από την ίδια τιμή).
      AUTHENTIK_API_URL: ${AUTHENTIK_API_URL:-http://authentik-server:9000}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-trifylli-dev-api-token}
      OUCHTRACKER_BASE_URL: ${OUCHTRACKER_BASE_URL:-http://ouchtracker-backend:3000}
      OUCHTRACKER_EMAIL: ${OUCHTRACKER_EMAIL:-}
      OUCHTRACKER_PASSWORD: ${OUCHTRACKER_PASSWORD:-}
      ESEO_BASE_URL: ${ESEO_BASE_URL:-}
      ESEO_REALM: ${ESEO_REALM:-eseo}
      ESEO_CLIENT_ID: ${ESEO_CLIENT_ID:-ssoClient}
      ESEO_REFRESH_TOKEN: ${ESEO_REFRESH_TOKEN:-}
      ESEO_WEBHOOK_SECRET: ${ESEO_WEBHOOK_SECRET:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      # Web Push: κλειδιά VAPID στο .env (ένα ζεύγος βγάζει το
      # `docker run --rm …/config gen-env`, ή `npx web-push generate-vapid-keys`).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@trifylli.local}
      # Email (σύνδεσμοι εντύπων/αξιολόγησης): στο development πάνε στο Mailpit (:8025).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-Trifylli <noreply@trifylli.local>}
      # Object storage — εσωτερικό όνομα υπηρεσίας (όχι localhost).
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-trifylli}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_FORCE_PATH_STYLE: 'true'
      # Error tracking (profile `errors`): DSN του project «api» με host
      # `glitchtip:8000` — το container δεν βλέπει το localhost του host.
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: development
      SENTRY_EXTRAS: 'true'
      CSP_REPORT_FORWARD_URL: ${CSP_REPORT_FORWARD_URL:-}
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${API_PORT:-3000}:3000'
    # Για να φτάνει το API σε υπηρεσίες του host (π.χ. Ouchtracker στο :80).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Ρυθμίσεις runtime (ο entrypoint γράφει το /config.js) — όχι build args.
    environment:
      API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:9010/application/o/trifylli/}
      OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-trifylli-pwa}
      OIDC_LOGOUT_FLOW: ${VITE_OIDC_LOGOUT_FLOW:-trifylli-invalidation}
      OUCHTRACKER_URL: ${VITE_OUCHTRACKER_URL:-http://localhost:9100}
      # Error tracking: DSN του project «pwa» με host localhost:8082 (το στέλνει ο browser).
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: development
      SENTRY_EXTRAS: 'true'
      # Session replay (profile `replay`) και analytics (profile `analytics`).
      OPENREPLAY_URL: ${OPENREPLAY_URL:-}
      OPENREPLAY_PROJECT_KEY: ${OPENREPLAY_PROJECT_KEY:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      - api

  # ─────────────────── OuchTracker (φαρμακεία) — profile: full ───────────────────
  # Μέρος της ίδιας στοίβας: κοινό Postgres (βάση `ouchtracker`), κοινό Authentik
  # (SSO), ίδιο δίκτυο. Χτίζεται από το γειτονικό repo `../OuchTracker`.
  ouchtracker-backend:
    profiles: ['full']
    build:
      context: ../OuchTracker/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Το nginx του frontend κάνει proxy στο `http://backend:3000`.
    networks:
      default:
        aliases:
          - backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:-trifylli}@postgres:5432/${OUCHTRACKER_DB:-ouchtracker}?schema=public
      CORS_ORIGIN: ${VITE_OUCHTRACKER_URL:-http://localhost:9100}
      JWT_SECRET: ${OUCHTRACKER_JWT_SECRET:-dev-ouchtracker-jwt-secret}
      JWT_EXPIRES_IN: 8h
      SEED_ADMIN_EMAIL: ${OUCHTRACKER_EMAIL:-admin@ouchtracker.local}
      SEED_ADMIN_PASSWORD: ${OUCHTRACKER_PASSWORD:-admin}
      SEED_ADMIN_NAME: System Admin
      # SSO — ίδιο Authentik (2ο OIDC app `ouchtracker`).
      OIDC_ISSUER: ${OUCHTRACKER_OIDC_ISSUER:-http://localhost:9010/application/o/ouchtracker/}
      OIDC_AUDIENCE: ${OUCHTRACKER_OIDC_AUDIENCE:-ouchtracker}
      OIDC_JWKS_URI: ${OUCHTRACKER_OIDC_JWKS_URI:-http://authentik-server:9000/application/o/ouchtracker/jwks/}
      OIDC_ADMIN_EMAILS: ${OUCHTRACKER_OIDC_ADMIN_EMAILS:-admin@trifylli.local,akadmin@trifylli.local}
    depends_on:
      postgres:
        condition: service_healthy

  ouchtracker-frontend:
    profiles: ['full']
    build:
      context: ../OuchTracker/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: /api
      OIDC_AUTHORITY: ${OUCHTRACKER_OIDC_ISSUER:-http://localhost:9010/application/o/ouchtracker/}
      OIDC_CLIENT_ID: ${OUCHTRACKER_OIDC_CLIENT_ID:-ouchtracker}
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${OUCHTRACKER_WEB_PORT:-9100}:80'
    depends_on:
      - ouchtracker-backend

  # ─────────────────── Error tracking (GlitchTip) — profile: errors ───────────────────
  #   docker compose --profile errors up -d glitchtip
  # UI στο http://localhost:8082. Πρώτος χρήστης (η εγγραφή είναι κλειστή):
  #   docker compose exec glitchtip ./manage.py createsuperuser
  # Μετά: οργανισμός `trifylli`, projects `api` και `pwa`, και τα DSN στο
  # apps/api/.env (`SENTRY_DSN`) και apps/web/.env (`VITE_SENTRY_DSN`) — docs/monitoring.md §3.
  # Χωρίς Valkey (ουρά/cache στο Postgres)· DuckDB για spans και logs· MCP ανοιχτό,
  # για διαλογή σφαλμάτων από το Claude Code (μόνο στο dev — βλ. ROADMAP §6).
  glitchtip-db:
    image: postgres:16-alpine
    profiles: ['errors']
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-trifylli}
      PGPASSWORD: ${POSTGRES_PASSWORD:-trifylli}
      PGDATABASE: ${POSTGRES_DB:-trifylli}
    # Η βάση φτιάχνεται εδώ και όχι στο init του Postgres: εκείνο τρέχει μόνο σε
    # άδειο volume, και τα υπάρχοντα dev volumes δεν θα την αποκτούσαν ποτέ.
    command:
      - sh
      - -c
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'glitchtip'" | grep -q 1 || createdb glitchtip
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-6.2.6}
    profiles: ['errors']
    restart: unless-stopped
    environment:
      SERVER_ROLE: all_in_one
      SECRET_KEY: trifylli-dev-glitchtip-secret-key-not-for-production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:-trifylli}@postgres:5432/glitchtip
      VALKEY_URL: ''
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_PORT:-8082}
      DEFAULT_FROM_EMAIL: GlitchTip <glitchtip@trifylli.local>
      # Οι ειδοποιήσεις φαίνονται στο Mailpit (:8025).
      EMAIL_URL: smtp://mailpit:1025
      ENABLE_USER_REGISTRATION: 'false'
      GLITCHTIP_RETENTION_DAYS: 30
      GLITCHTIP_ENABLE_DUCKDB: 'true'
      GLITCHTIP_COLD_STORAGE_DIR: /code/uploads/cold
      GLITCHTIP_ENABLE_MCP: 'true'
    volumes:
      - glitchtip-uploads:/code/uploads
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${GLITCHTIP_PORT:-8082}:8000'
    depends_on:
      glitchtip-db:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  # «Log in with Authentik»: ο OIDC provider του GlitchTip από το περιβάλλον
  # (infra/glitchtip/configure-sso.py) — σε κάθε `up`, ασφαλές στην επανάληψη.
  glitchtip-sso:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-6.2.6}
    profiles: ['errors']
    restart: 'no'
    environment:
      SECRET_KEY: trifylli-dev-glitchtip-secret-key-not-for-production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:-trifylli}@postgres:5432/glitchtip
      VALKEY_URL: ''
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_PORT:-8082}
      GLITCHTIP_OIDC_ISSUER: http://localhost:9010/application/o/glitchtip/
      GLITCHTIP_OIDC_CLIENT_SECRET: trifylli-dev-glitchtip-oidc
    volumes:
      - ./infra/glitchtip:/opt/glitchtip:ro
    entrypoint: ['sh', '-c', './manage.py shell < /opt/glitchtip/configure-sso.py']
    depends_on:
      glitchtip:
        condition: service_started

  # Μόνο στο dev: ο browser βλέπει το Authentik στο localhost:9010, και το
  # GlitchTip πρέπει να το φτάνει στο ΙΔΙΟ URL (αλλιώς δεν ταιριάζει το issuer).
  # Ο socat ζει στο network namespace του GlitchTip και κάνει το δικό του
  # localhost:9010 → authentik-server:9000. Στην παραγωγή δεν χρειάζεται: εκεί
  # το GlitchTip φτάνει το δημόσιο sso.<domain>.
  glitchtip-sso-bridge:
    image: alpine/socat:1.8.0.3
    profiles: ['errors']
    restart: unless-stopped
    network_mode: service:glitchtip
    command: ['TCP-LISTEN:9010,fork,reuseaddr,bind=127.0.0.1', 'TCP:authentik-server:9000']
    depends_on:
      - glitchtip

  # ─────────────────── Analytics (Umami) — profile: analytics ───────────────────
  #   docker compose --profile analytics up -d umami
  # UI: http://localhost:8083 (πρώτη είσοδος admin / umami — άλλαξέ τον). Μετά
  # «Add website» → το website id στο `VITE_UMAMI_WEBSITE_ID`. Ανώνυμο, χωρίς
  # cookies· βάση `umami` στον ίδιο Postgres. Μόνιμο — δεν είναι από τα extras.
  umami-db:
    image: postgres:16-alpine
    profiles: ['analytics']
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-trifylli}
      PGPASSWORD: ${POSTGRES_PASSWORD:-trifylli}
      PGDATABASE: ${POSTGRES_DB:-trifylli}
    command:
      - sh
      - -c
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'umami'" | grep -q 1 || createdb umami
    depends_on:
      postgres:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    profiles: ['analytics']
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trifylli}:${POSTGRES_PASSWORD:-trifylli}@postgres:5432/umami
      APP_SECRET: trifylli-dev-umami-secret
      DISABLE_TELEMETRY: '1'
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:${UMAMI_PORT:-8083}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      umami-db:
        condition: service_completed_successfully

  # ─────────────────── OpenReplay (session replay) — profile: replay ───────────────────
  #   docker compose --profile replay up -d
  # UI: http://replay.localhost:8090 — ο πρώτος λογαριασμός που γράφεται είναι ο
  # owner (μετά «Add project» → project key στο `VITE_OPENREPLAY_PROJECT_KEY`).
  # ~20 containers, ~8 GB RAM. Δικό του δίκτυο (`replay`): τα ονόματα των
  # υπηρεσιών του (redis, postgresql, minio) θα συγκρούονταν με τα δικά μας.
  # Πρότυπο: OpenReplay v1.28.0 scripts/docker-compose — infra/openreplay/README.md.
  replay-fs-permission:
    image: debian:stable-slim
    profiles: ['replay']
    restart: 'no'
    volumes:
      - replay-shared:/mnt/efs
      - replay-minio:/mnt/minio
      - replay-postgres:/mnt/postgres
    entrypoint: ['/bin/bash', '-c', 'chown -R 1001:1001 /mnt/efs /mnt/postgres && chown -R 10001:10001 /mnt/minio']

  replay-postgres:
    image: ghcr.io/openreplay/postgres:17
    profiles: ['replay']
    restart: unless-stopped
    volumes:
      - replay-postgres:/bitnami/postgresql
    networks:
      replay:
        aliases: [postgresql, postgresql.db.svc.cluster.local]
    environment:
      POSTGRESQL_PASSWORD: trifylli-dev-replay
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      replay-fs-permission:
        condition: service_completed_successfully

  replay-clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    profiles: ['replay']
    restart: unless-stopped
    volumes:
      - replay-clickhouse:/var/lib/clickhouse
    networks:
      replay:
        aliases: [clickhouse, clickhouse-openreplay-clickhouse.db.svc.cluster.local]
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    healthcheck:
      test: ['CMD-SHELL', "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  replay-redis:
    image: ghcr.io/openreplay/valkey:8
    profiles: ['replay']
    restart: unless-stopped
    volumes:
      - replay-redis:/data
    networks:
      replay:
        aliases: [redis, redis-master.db.svc.cluster.local]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  replay-minio:
    image: docker.io/rustfs/rustfs:1.0.0-beta.1
    profiles: ['replay']
    restart: unless-stopped
    volumes:
      - replay-minio:/data
    networks:
      replay:
        aliases: [minio, minio.db.svc.cluster.local]
    environment:
      RUSTFS_ACCESS_KEY: trifylli-dev-replay-s3
      RUSTFS_SECRET_KEY: trifylli-dev-replay-s3-secret
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_VOLUMES: /data
    healthcheck:
      test: ['CMD-SHELL', 'curl -so /dev/null http://localhost:9000/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      replay-fs-permission:
        condition: service_completed_successfully

  # Buckets (+ διαγραφή εγγραφών στις 30 ημέρες) και σχήματα βάσεων — σε κάθε
  # `up`· όλα είναι ασφαλή στην επανάληψη (το σχήμα του Postgres σταματά αν υπάρχει).
  replay-minio-init:
    image: ghcr.io/openreplay/minio:2025
    profiles: ['replay']
    restart: 'no'
    user: root
    networks: [replay]
    volumes:
      - ./infra/openreplay/minio.sh:/tmp/minio.sh:ro
    environment:
      MINIO_HOST: http://minio.db.svc.cluster.local:9000
      MINIO_ACCESS_KEY: trifylli-dev-replay-s3
      MINIO_SECRET_KEY: trifylli-dev-replay-s3-secret
    entrypoint: ['/bin/bash', '/tmp/minio.sh', 'init']
    depends_on:
      replay-minio:
        condition: service_healthy

  replay-db-init:
    image: ghcr.io/openreplay/postgres:17
    profiles: ['replay']
    restart: 'no'
    networks: [replay]
    volumes:
      - ./infra/openreplay/init_pg_schema.sql:/tmp/init_schema.sql:ro
    environment:
      PGHOST: postgresql
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: trifylli-dev-replay
    entrypoint: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/tmp/init_schema.sql']
    depends_on:
      replay-postgres:
        condition: service_healthy
      replay-minio-init:
        condition: service_completed_successfully

  replay-ch-init:
    image: clickhouse/clickhouse-server:26.2-alpine
    profiles: ['replay']
    restart: 'no'
    networks: [replay]
    volumes:
      - ./infra/openreplay/init_ch_schema.sql:/tmp/init_schema.sql:ro
    entrypoint: ['/bin/sh', '-c', 'clickhouse-client -h clickhouse --user default --port 9000 --multiquery < /tmp/init_schema.sql || true']
    depends_on:
      replay-clickhouse:
        condition: service_healthy

  replay-nginx:
    image: nginx:1.27-alpine
    profiles: ['replay']
    restart: unless-stopped
    volumes:
      - ./infra/openreplay/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      REPLAY_LISTEN_PORT: '8090'
    networks:
      replay:
        # Το δημόσιο όνομα δείχνει στον nginx και ΜΕΣΑ στο δίκτυο: οι υπηρεσίες
        # φτάνουν το S3 μέσω του `REPLAY_URL`. Ο browser λύνει μόνος του το
        # `*.localhost` στο 127.0.0.1.
        aliases: [nginx, replay.localhost]
    ports:
      - '${DEV_BIND_ADDR:-127.0.0.1}:8090:8090'

  replay-alerts:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/alerts:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [alerts-openreplay, alerts-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      EMAIL_HOST: ''
      EMAIL_PORT: '587'
      EMAIL_USER: ''
      EMAIL_PASSWORD: ''
      EMAIL_USE_TLS: 'true'
      EMAIL_USE_SSL: 'false'
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: 'OpenReplay <replay@trifylli.local>'

  replay-api:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/api:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [api-openreplay, api-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: trifylli-dev-replay-token-api
      REDIS_CACHE_ENABLED: 'false'

  replay-images:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/images:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [images-openreplay, images-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: trifylli-dev-replay-token
      FS_CLEAN_HRS: '24'

  replay-sink:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/sink:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [sink-openreplay, sink-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-sourcemapreader:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/sourcemapreader:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [sourcemapreader-openreplay, sourcemapreader-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      SMR_HOST: '0.0.0.0'
      S3_HOST: 'http://minio.db.svc.cluster.local:9000'

  replay-spot:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/spot:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [spot-openreplay, spot-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: spots
      TOKEN_SECRET: trifylli-dev-replay-token-api
      CACHE_ASSETS: 'true'
      FS_CLEAN_HRS: '24'

  replay-storage:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/storage:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [storage-openreplay, storage-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      FS_CLEAN_HRS: '24'

  replay-assets:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/assets:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [assets-openreplay, assets-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: sessions-assets

  replay-assist:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/assist:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [assist-openreplay, assist-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      REDIS_URL: redis-master.db.svc.cluster.local
      CLEAR_SOCKET_TIME: '720'
      MAX_BACKPRESSURE_KB: '128'
      debug: '0'
      redis: 'false'

  replay-canvases:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/canvases:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [canvases-openreplay, canvases-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: mobs
      TOKEN_SECRET: trifylli-dev-replay-token
      FS_CLEAN_HRS: '24'

  replay-chalice:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/chalice:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [chalice-openreplay, chalice-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      EMAIL_HOST: ''
      EMAIL_PORT: '587'
      EMAIL_USER: ''
      EMAIL_PASSWORD: ''
      EMAIL_USE_TLS: 'true'
      EMAIL_USE_SSL: 'false'
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: 'OpenReplay <replay@trifylli.local>'
      sourcemaps_reader: 'http://sourcemapreader-openreplay.app.svc.cluster.local:9000/{}/sourcemaps'
      CLUSTER_URL: svc.cluster.local
      JWT_EXPIRATION: '86400'
      jwt_algorithm: HS512
      root_path: /api
      sessions_region: us-east-1
      ASSIST_RECORDS_BUCKET: records
      sessions_bucket: mobs
      IOS_VIDEO_BUCKET: mobs
      sourcemaps_bucket: sourcemaps
      js_cache_bucket: sessions-assets
      CH_COMPRESSION: 'false'
      SCIM_ACCESS_SECRET_KEY: trifylli-dev-replay-scim
      SCIM_REFRESH_SECRET_KEY: trifylli-dev-replay-scim
      SCIM_ACCESS_TOKEN_EXPIRE_SECONDS: '86400'
      SAML2_MD_URL: ''
      announcement_url: ''
      assist_secret: ''
      async_Token: ''
      captcha_key: ''
      captcha_server: ''
      iceServers: ''
      SKIP_H_SSL: 'True'

  replay-db:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/db:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [db-openreplay, db-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-ender:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/ender:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [ender-openreplay, ender-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env

  replay-frontend:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/frontend:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [frontend-openreplay, frontend-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      TRACKER_HOST: 'http://replay.localhost:8090/script'
      HTTP_PORT: '80'

  replay-http:
    <<: *replay-app
    image: public.ecr.aws/p1t3u8a3/http:${REPLAY_VERSION:-v1.28.0}
    networks:
      replay:
        aliases: [http-openreplay, http-openreplay.app.svc.cluster.local]
    environment:
      <<: *replay-env
      BUCKET_NAME: uxtesting-records
      TOKEN_SECRET: trifylli-dev-replay-token
      CACHE_ASSETS: 'true'

volumes:
  postgres-data:
  authentik-media:
  garage-data:
  glitchtip-uploads:
  replay-postgres:
  replay-clickhouse:
  replay-redis:
  replay-minio:
  replay-shared:

networks:
  replay:
