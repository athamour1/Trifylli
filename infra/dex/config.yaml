# Dex: η γέφυρα SSO του OpenObserve (OpenObserve → Dex → Authentik).
#
# Το OpenObserve Enterprise κάνει SSO μόνο μέσω Dex. Ο Dex δεν έχει δικούς του
# χρήστες: στέλνει τον browser στο Authentik (connector `authentik`), και εκεί
# η εφαρμογή `openobserve` επιτρέπεται ΜΟΝΟ στην ομάδα `trifylli-monitoring`
# (infra/authentik/openobserve-oidc.yaml). Βλ. docs/monitoring.md §5.
#
# Κανένα μυστικό εδώ: οι τιμές έρχονται από το περιβάλλον μέσω του entrypoint
# του image (gomplate, `.Env.<ΟΝΟΜΑ>` σε διπλά άγκιστρα) — ίδιο αρχείο για dev και παραγωγή. Η
# δική του αντικατάσταση `$VAR` του Dex ΔΕΝ πιάνει το `issuer` (και θα άλλαζε
# ένα `$` μέσα σε μυστικό): κλειστή με DEX_EXPAND_ENV=false στο compose.
issuer: '{{ .Env.DEX_ISSUER }}'

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

frontend:
  issuer: Trifylli

oauth2:
  responseTypes: [code]
  skipApprovalScreen: true

expiry:
  # Πόσο κρατά η είσοδος στο OpenObserve πριν ξαναζητήσει SSO.
  idTokens: 8h
  refreshTokens:
    validIfNotUsedFor: 24h

enablePasswordDB: false

staticClients:
  - id: openobserve
    name: OpenObserve
    secret: '{{ .Env.OPENOBSERVE_DEX_CLIENT_SECRET }}'
    redirectURIs:
      - '{{ .Env.OPENOBSERVE_URL }}/config/redirect'

connectors:
  - type: oidc
    id: authentik
    name: Trifylli (Authentik)
    config:
      issuer: '{{ .Env.OPENOBSERVE_OIDC_ISSUER }}'
      clientID: openobserve
      clientSecret: '{{ .Env.OPENOBSERVE_OIDC_CLIENT_SECRET }}'
      redirectURI: '{{ .Env.DEX_ISSUER }}/callback'
      scopes: [openid, profile, email]
      # Το Authentik δεν δηλώνει πάντα `email_verified`· τα emails εκεί τα
      # ορίζει ο υπερδιαχειριστής, όχι ο ίδιος ο χρήστης.
      insecureSkipEmailVerified: true
      getUserInfo: true
      # Χωρίς `prompt=consent` (προεπιλογή του connector): αλλιώς το Authentik
      # δείχνει οθόνη «επιτρέπεις…;» σε κάθε είσοδο.
      promptType: ''
