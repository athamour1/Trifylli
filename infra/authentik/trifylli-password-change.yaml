version: 1
# Trifylli — αλλαγή κωδικού από τις Ρυθμίσεις της εφαρμογής.
#
# Γιατί δική μας ροή και όχι η ενσωματωμένη `default-password-change`: εκείνη
# δέχεται `?next=` μόνο **σχετικό** (ίδιος host με το Authentik) — με απόλυτο
# απαντά «Invalid next URL» — οπότε δεν μπορεί να γυρίσει τον χρήστη στο
# Trifylli. Η μόνη διέξοδος που ο executor δεν ελέγχει είναι το κλειδί
# `redirect` στο πλάνο της ροής, που «μπορεί να το ορίσει μόνο expression
# policy ή το ίδιο το Authentik». Αυτό κάνει η πολιτική εδώ.
#
# Τα στάδια είναι τα ίδια με της επαναφοράς (`trifylli-recovery.yaml`): ίδια
# πεδία, ίδια πολιτική κωδικού, ίδιο `never_create`. Εφαρμόστε πρώτα εκείνο.
#
#   docker compose exec authentik-worker ak apply_blueprint /blueprints/custom/trifylli-password-change.yaml
metadata:
  name: Trifylli — αλλαγή κωδικού
  labels:
    blueprints.goauthentik.io/instantiate: 'true'

context:
  # Η διεύθυνση της PWA — ίδια μεταβλητή με το trifylli-oidc.yaml.
  TRIFYLLI_APP_URL: !Env [TRIFYLLI_APP_URL, 'http://localhost:8080/']

entries:
  # `require_authenticated`: αλλάζει κωδικό όποιος είναι ήδη μέσα. Όποιος δεν
  # θυμάται τον κωδικό του παίρνει σύνδεσμο με email (ροή recovery).
  - model: authentik_flows.flow
    id: trifylli-password-change-flow
    identifiers:
      slug: trifylli-password-change
    attrs:
      name: Trifylli — αλλαγή κωδικού
      title: Αλλαγή κωδικού
      designation: stage_configuration
      authentication: require_authenticated
      # Στο «Όχι εσύ;» ή σε λάθος η ροή ακυρώνεται· χωρίς redirect ο χρήστης
      # θα έμενε στο Authentik.
      denied_action: message_continue

  # Η επιστροφή: μόλις γραφτεί ο κωδικός, πίσω στις Ρυθμίσεις με σημάδι ώστε
  # η εφαρμογή να το επιβεβαιώσει. Μπαίνει στο binding του σταδίου εγγραφής,
  # γιατί εκεί το `flow_plan` υπάρχει στο context της πολιτικής.
  - model: authentik_policies_expression.expressionpolicy
    id: trifylli-password-change-redirect
    identifiers:
      name: trifylli-password-change-redirect
    attrs:
      execution_logging: false
      expression: !Format
        - |
          plan = request.context.get("flow_plan")
          if plan:
              plan.context["redirect"] = "%ssettings?password=ok"
          return True
        - !Context TRIFYLLI_APP_URL

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf trifylli-password-change-flow
      stage: !Find [authentik_stages_prompt.promptstage, [name, trifylli-recovery-prompt]]
      order: 10
    attrs:
      evaluate_on_plan: true
      invalid_response_action: retry

  - model: authentik_flows.flowstagebinding
    id: trifylli-password-change-binding-write
    identifiers:
      target: !KeyOf trifylli-password-change-flow
      stage: !Find [authentik_stages_user_write.userwritestage, [name, trifylli-recovery-user-write]]
      order: 20
    attrs:
      evaluate_on_plan: true
      invalid_response_action: retry

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf trifylli-password-change-redirect
      target: !KeyOf trifylli-password-change-binding-write
      order: 0
    attrs:
      enabled: true
