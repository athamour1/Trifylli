# Authentik blueprint για το Trifylli.
#
# Το Authentik απαντά **μόνο** στο «ποιος είσαι». Το «τι μπορείς» το ορίζει ο
# υπερδιαχειριστής μέσα στην εφαρμογή (`user.accountRole`), οπότε δεν υπάρχουν
# groups ανά κλάδο εδώ — θα ήταν δεύτερη, αναξιόπιστη πηγή αλήθειας.
#
# Το μόνο που πρέπει οπωσδήποτε να φτάνει στο token είναι το **email**: είναι το
# κλειδί που δένει την ταυτότητα με τον λογαριασμό της εφαρμογής. Γι' αυτό
# χρησιμοποιούμε τα προεπιλεγμένα scope mappings του Authentik αντί για δικά μας.
#
# Εφαρμόζεται αυτόματα από τον worker (mount στο /blueprints/custom), ή χειροκίνητα:
#   docker compose exec authentik-worker ak apply_blueprint /blueprints/custom/trifylli-oidc.yaml
version: 1
metadata:
  name: Trifylli — OIDC provider & application
  labels:
    blueprints.goauthentik.io/instantiate: 'true'

context:
  # Το δημόσιο URL της εφαρμογής (με τελικό «/»). Οδηγεί redirect URIs, launch
  # URL, post-logout redirect και front-channel logout URI. Έρχεται από το
  # περιβάλλον του Authentik (`!Env`) ώστε **το ίδιο blueprint να δουλεύει dev
  # και prod** χωρίς χειροκίνητη αλλαγή: στο prod όρισε `TRIFYLLI_APP_URL` στο
  # authentik-server/worker (π.χ. https://app.trifylli.gr/)· αλλιώς localhost.
  TRIFYLLI_APP_URL: !Env [TRIFYLLI_APP_URL, 'http://localhost:8080/']

entries:
  # Στην πρώτη εκκίνηση όλα τα blueprints τρέχουν μαζί: τα `!Find` πιο κάτω
  # ψάχνουν αντικείμενα που φτιάχνουν τα default blueprints, και αν δεν προλάβουν
  # βγαίνουν κενά (`stage: may not be null`). Εφαρμόζονται λοιπόν πρώτα, εδώ.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # ── Το claim που δένει χρήστη Authentik ↔ λογαριασμό Trifylli ──
  #
  # Το API, όταν προσκαλεί, γράφει στον χρήστη το attribute
  # `trifylli_account_id`. Εδώ το βγάζουμε στο token ως claim, ώστε η σύνδεση
  # να μην εξαρτάται από το email — που είναι δεδομένο, όχι ταυτότητα. Μπαίνει
  # κάτω από το scope `profile` που ήδη ζητά η PWA· πολλά mappings με το ίδιο
  # scope συγχωνεύονται.
  - model: authentik_providers_oauth2.scopemapping
    id: trifylli-account-claim
    identifiers:
      name: Trifylli — σταθερός δεσμός λογαριασμού
    attrs:
      scope_name: profile
      description: Ο δεσμός με τον λογαριασμό Trifylli
      expression: |
        return {"trifylli_account_id": request.user.attributes.get("trifylli_account_id")}

  # ── Ροή εξουσιοδότησης χωρίς κανένα βήμα ──
  #
  # Δική μας ροή και όχι η προεπιλεγμένη, για δύο λόγους: η default είναι κοινή
  # για κάθε εφαρμογή του Authentik και δεν πρέπει να την αλλάζουμε, και έτσι
  # μπορούμε να της δώσουμε ελληνικό τίτλο και το δικό μας φόντο.
  #
  # Η ροή είναι σκόπιμα **κενή**: καμία συγκατάθεση, καμία ενδιάμεση οθόνη. Ο
  # χρήστης που έχει ήδη συνεδρία στο Authentik επιστρέφει στην εφαρμογή χωρίς
  # να δει τίποτα. Το `offline_access` δεν προσθέτει συγκατάθεση: το Authentik
  # τη βάζει μόνο με `prompt=consent` ή αν τη ζητά η ίδια η ροή.
  - model: authentik_flows.flow
    id: trifylli-authorization-flow
    identifiers:
      slug: trifylli-authorization
    attrs:
      name: Trifylli — εξουσιοδότηση
      title: Σύνδεση στο Trifylli
      designation: authorization
      authentication: require_authenticated

  # ── Ροή αποσύνδεσης που πραγματικά αποσυνδέει ──
  #
  # Η προεπιλεγμένη ροή αποσύνδεσης του provider δεν έχει κανένα στάδιο: το
  # Authentik δείχνει μια δική του οθόνη («You've logged out of…» με κουμπιά)
  # και **δεν** τερματίζει τη συνεδρία του. Σε κοινόχρηστο υπολογιστή Εστίας
  # αυτό σημαίνει ότι ο επόμενος χρήστης μπαίνει αυτόματα ως ο προηγούμενος —
  # η αποσύνδεση θα ήταν διακοσμητική.
  #
  # Δική μας ροή με στάδιο `user_logout` και τίποτε άλλο: η συνεδρία κλείνει και
  # ο χρήστης επιστρέφει κατευθείαν στην εφαρμογή, που τον στέλνει σε καθαρή
  # οθόνη σύνδεσης.
  - model: authentik_flows.flow
    id: trifylli-invalidation-flow
    identifiers:
      slug: trifylli-invalidation
    attrs:
      name: Trifylli — αποσύνδεση
      title: Αποσύνδεση από το Trifylli
      designation: invalidation
      # `none` και όχι `require_authenticated`: το πρώτο στάδιο τερματίζει τη
      # συνεδρία, οπότε στο δεύτερο δεν υπάρχει πια χρήστης. Με απαίτηση
      # ταυτοποίησης η ροή κοβόταν στη μέση με «Flow does not apply to current
      # user» και το redirect δεν έτρεχε ποτέ.
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf trifylli-invalidation-flow
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 0

  # Μετά την αποσύνδεση, πίσω στην εφαρμογή χωρίς ενδιάμεση οθόνη.
  #
  # Το `?next=` του executor απορρίπτει absolute URLs (προστασία open-redirect),
  # οπότε δεν μπορεί να μας γυρίσει σε άλλο origin. Το Redirect Stage είναι ο
  # σωστός μηχανισμός: ορίζει `PLAN_CONTEXT_REDIRECT`, που το Authentik δέχεται
  # και ως απόλυτο URL γιατί το έβαλε δική του ρύθμιση, όχι ο χρήστης.
  - model: authentik_stages_redirect.redirectstage
    id: trifylli-post-logout-redirect
    identifiers:
      name: trifylli-post-logout
    attrs:
      mode: static
      target_static: !Context TRIFYLLI_APP_URL
      keep_context: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf trifylli-invalidation-flow
      stage: !KeyOf trifylli-post-logout-redirect
      order: 10

  - model: authentik_providers_oauth2.oauth2provider
    id: trifylli-provider
    identifiers:
      name: Trifylli PWA
    attrs:
      # Δημόσιος client: η PWA δεν μπορεί να κρύψει secret, οπότε η ασφάλεια
      # στηρίζεται στο PKCE και στα αυστηρά redirect URIs.
      client_type: public
      client_id: trifylli-pwa
      # Σταθερό, αδιαφανές `sub`: το email είναι το κλειδί **πρώτης**
      # αντιστοίχισης, αλλά μετά τη σύνδεση ο χρήστης εντοπίζεται από το `sub`.
      # Έτσι μια αλλαγή email στο Authentik δεν κλειδώνει κανέναν έξω.
      sub_mode: hashed_user_id

      # Το Authentik 2026.x απαιτεί ρητή δήλωση των επιτρεπτών grant types (νέο
      # πεδίο· κενή λίστα = κανένα, οπότε το authorize απορρίπτεται ως
      # «malformed»). Η PWA χρησιμοποιεί Authorization Code + PKCE· το
      # refresh_token κρατά τη σύνδεση ζωντανή (βλ. `refresh_token_validity`).
      grant_types:
        - authorization_code
        - refresh_token

      authorization_flow: !KeyOf trifylli-authorization-flow
      invalidation_flow: !KeyOf trifylli-invalidation-flow

      # Χωρίς signing key το access token δεν είναι υπογεγραμμένο JWT και το API
      # δεν μπορεί να το επικυρώσει μέσω JWKS.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, 'goauthentik.io/providers/oauth2/scope-openid']]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, 'goauthentik.io/providers/oauth2/scope-profile']]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, 'goauthentik.io/providers/oauth2/scope-email']]
        # Χωρίς αυτό το Authentik πετά σιωπηλά το `offline_access` και δεν δίνει refresh token.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, 'goauthentik.io/providers/oauth2/scope-offline_access']]
        - !KeyOf trifylli-account-claim

      redirect_uris:
        # Κύριο URL εφαρμογής (από TRIFYLLI_APP_URL· dev→localhost:8080, prod→domain).
        - matching_mode: strict
          url: !Format ['%sauth/callback', !Context TRIFYLLI_APP_URL]
        - matching_mode: strict
          url: !Format ['%sauth/silent', !Context TRIFYLLI_APP_URL]
        - matching_mode: strict
          url: !Context TRIFYLLI_APP_URL
        # Η θύρα 9000 είναι του `quasar dev` (τοπικό hot-reload, εκτός container) —
        # μόνο development· στο prod απλώς δεν ταιριάζει ποτέ, ακίνδυνο.
        - matching_mode: strict
          url: http://localhost:9000/auth/callback
        - matching_mode: strict
          url: http://localhost:9000/auth/silent
        - matching_mode: strict
          url: http://localhost:9000/

      # Ούτε πολύ σύντομο (κάθε λήξη είναι ένα round trip στο Authentik) ούτε
      # πολύ μακρύ: ένα access token που διέρρευσε ζει το πολύ μισή ώρα.
      access_token_validity: minutes=30

      # Η σύνδεση κρατά **ένα μήνα από την τελευταία χρήση**: κάθε ανανέωση
      # (κάθε ~30΄ όσο η εφαρμογή είναι ανοιχτή, ή μόλις ανοίξει) δίνει νέο
      # refresh token με νέο μήνα και ακυρώνει το παλιό (`refresh_token_threshold`
      # = 0, η προεπιλογή: ανανεώνεται πάντα). Δεν εξαρτάται από το cookie του
      # Authentik. Το logout το ανακαλεί (βλ. `apps/web/src/lib/oidc.ts`).
      refresh_token_validity: days=30

      # ── Single Logout (native front-channel — Authentik 2025.10+) ──
      #
      # Όταν ο χρήστης αποσυνδεθεί από ΟΠΟΙΑΔΗΠΟΤΕ εφαρμογή του ίδιου SSO, το
      # στάδιο `user_logout` της ροής αποσύνδεσης κάνει το Authentik να φορτώσει
      # αυτό το URL σε κρυφό iframe, με `?iss=&sid=`. Η σελίδα καθαρίζει την
      # τοπική συνεδρία και σηκώνει ένα σήμα στο localStorage· οι ανοιχτές
      # καρτέλες το ακούν (storage event) κι αποσυνδέονται αμέσως. Έτσι το logout
      # γίνεται παντού, άμεσα — χωρίς τα παλιά τεχνάσματα (σύντομο token,
      # flag-based logout στην εκκίνηση).
      logout_uri: !Format ['%sauth/frontchannel-logout', !Context TRIFYLLI_APP_URL]
      logout_method: frontchannel

  - model: authentik_core.application
    id: trifylli-app
    identifiers:
      slug: trifylli
    attrs:
      name: Trifylli
      provider: !KeyOf trifylli-provider
      meta_description: Διαχείριση Τοπικού Τμήματος Σ.Ε.Ο.
      meta_publisher: Σ.Ε.Ο.
      # Ρητό launch URL: αλλιώς το Authentik πέφτει στο πρώτο redirect_uri.
      meta_launch_url: !Context TRIFYLLI_APP_URL
      open_in_new_tab: false
