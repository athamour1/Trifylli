  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f3f2"/>
      <stop offset="100%" stop-color="#e3ebe4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <g fill="#2e7d32" opacity="0.05">
    <circle cx="1320" cy="180" r="150"/>
    <circle cx="1180" cy="360" r="150"/>
    <circle cx="1460" cy="360" r="150"/>
    <rect x="1290" y="420" width="60" height="260" rx="30"/>
  </g>
