packages:
  - 'apps/*'
  - 'packages/*'

# Ρητή απόφαση ανά εξάρτηση που θέλει να τρέξει postinstall script.
# Επιτρέπουμε όσα κατεβάζουν πραγματικά binaries που χρειαζόμαστε και
# απορρίπτουμε το @scarf/scarf, που στέλνει μόνο τηλεμετρία εγκατάστασης.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@parcel/watcher': true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - js-yaml@5.4.3

# Επιδιορθώσεις ασφάλειας σε transitive εξαρτήσεις (pnpm audit --prod).
# - multer: DoS μέσω multipart field names — εκτεθειμένο ευθέως από το /api/files
# - js-yaml (μέσω @nestjs/swagger): CPU μέσω merge keys· ίδιο major, patched
overrides:
  multer: '>=2.3.0'
  '@nestjs/swagger>js-yaml': '>=5.4.3'
